name: verify

on:
  push:
    branches: [main, experimental]
  pull_request:
    branches: [main, experimental]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-emulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap hash-locked Dagger runtime
        run: python3 .github/dagger/_bootstrap.py
      - name: Validate deterministic emulation and explicit property tests
        run: .dagger-ci-venv/bin/python .github/dagger/property_tests.py

  reliability-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap hash-locked Dagger runtime
        run: python3 .github/dagger/_bootstrap.py
      - id: dagger
        name: Reliability contract
        run: .dagger-ci-venv/bin/python .github/dagger/reliability_contract.py

  proto:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mark protobuf producer start
        uses: ./.github/actions/ci-evidence
        with:
          mode: start
          job-id: proto
          job-name: proto / buf
          artifact-key: proto
      - name: Bootstrap hash-locked Dagger runtime
        run: python3 .github/dagger/_bootstrap.py
      - name: Run protobuf verification
        uses: ./.github/actions/ci-evidence
        with:
          mode: run
          job-id: proto
          job-name: proto / buf
          artifact-key: proto
          step-name: Run Dagger protobuf verification
          command: .dagger-ci-venv/bin/python .github/dagger/proto.py
      - name: Finalize protobuf evidence
        if: ${{ always() }}
        uses: ./.github/actions/ci-evidence
        with:
          mode: finish
          job-id: proto
          job-name: proto / buf
          artifact-key: proto
          status: ${{ job.status }}
          command-identity: dagger/proto

  go:
    needs: proto
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mark Go producer start
        uses: ./.github/actions/ci-evidence
        with:
          mode: start
          job-id: go
          job-name: go / encore
          artifact-key: go
      - name: Bootstrap hash-locked Dagger runtime
        run: python3 .github/dagger/_bootstrap.py
      - name: Run Go tests
        uses: ./.github/actions/ci-evidence
        with:
          mode: run
          job-id: go
          job-name: go / encore
          artifact-key: go
          step-name: Run Go tests
          command: .dagger-ci-venv/bin/python .github/dagger/go.py tests
      - name: Run Go race detector
        uses: ./.github/actions/ci-evidence
        with:
          mode: run
          job-id: go
          job-name: go / encore
          artifact-key: go
          step-name: Run Go race detector
          command: .dagger-ci-venv/bin/python .github/dagger/go.py race
      - name: Run Go quality checks
        uses: ./.github/actions/ci-evidence
        with:
          mode: run
          job-id: go
          job-name: go / encore
          artifact-key: go
          step-name: Run Go quality checks
          command: .dagger-ci-venv/bin/python .github/dagger/go.py quality
      - name: Run Go vulnerability audit
        uses: ./.github/actions/ci-evidence
        with:
          mode: run
          job-id: go
          job-name: go / encore
          artifact-key: go
          step-name: Run Go vulnerability audit
          command: .dagger-ci-venv/bin/python .github/dagger/go.py audit
      - name: Build and scan local backend image
        uses: ./.github/actions/ci-evidence
        with:
          mode: run
          job-id: go
          job-name: go / encore
          artifact-key: go
          step-name: Build and scan local backend image
          command: .dagger-ci-venv/bin/python .github/dagger/go.py image
      - name: Finalize Go evidence
        if: ${{ always() }}
        uses: ./.github/actions/ci-evidence
        with:
          mode: finish
          job-id: go
          job-name: go / encore
          artifact-key: go
          status: ${{ job.status }}
          command-identity: dagger/go
          dependencies: proto

  rust-trade-settlement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mark Rust producer start
        uses: ./.github/actions/ci-evidence
        with:
          mode: start
          job-id: rust-trade-settlement
          job-name: rust / trade-settlement
          artifact-key: rust-trade-settlement
      - name: Bootstrap hash-locked Dagger runtime
        run: python3 .github/dagger/_bootstrap.py
      - name: Run Rust settlement verification
        uses: ./.github/actions/ci-evidence
        with:
          mode: run
          job-id: rust-trade-settlement
          job-name: rust / trade-settlement
          artifact-key: rust-trade-settlement
          step-name: Run Rust tests
          command: .dagger-ci-venv/bin/python .github/dagger/rust.py
      - name: Finalize Rust evidence
        if: ${{ always() }}
        uses: ./.github/actions/ci-evidence
        with:
          mode: finish
          job-id: rust-trade-settlement
          job-name: rust / trade-settlement
          artifact-key: rust-trade-settlement
          status: ${{ job.status }}
          command-identity: dagger/rust

  terraform:
    name: Terraform (${{ matrix.provider }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: eks
            root: distributed-backend/terraform/eks
            launcher: terraform_eks.py
            lockfile_args: -lockfile=readonly
          - provider: gke
            root: distributed-backend/terraform/gke
            launcher: terraform_gke.py
            lockfile_args: -lockfile=readonly
          - provider: talos-omni
            root: distributed-backend/terraform/talos-omni
            launcher: terraform_talos_omni.py
            lockfile_args: -lockfile=readonly
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mark Terraform producer start
        uses: ./.github/actions/ci-evidence
        with:
          mode: start
          job-id: terraform
          job-name: terraform / ${{ matrix.provider }}
          artifact-key: terraform-${{ matrix.provider }}
      - name: Bootstrap hash-locked Dagger runtime
        run: python3 .github/dagger/_bootstrap.py
      - name: Run Terraform provider verification
        uses: ./.github/actions/ci-evidence
        with:
          mode: run
          job-id: terraform
          job-name: terraform / ${{ matrix.provider }}
          artifact-key: terraform-${{ matrix.provider }}
          step-name: Terraform ${{ matrix.provider }}
          command: .dagger-ci-venv/bin/python .github/dagger/${{ matrix.launcher }}
      - name: Finalize Terraform evidence
        if: ${{ always() }}
        uses: ./.github/actions/ci-evidence
        with:
          mode: finish
          job-id: terraform
          job-name: terraform / ${{ matrix.provider }}
          artifact-key: terraform-${{ matrix.provider }}
          status: ${{ job.status }}
          command-identity: dagger/terraform-${{ matrix.provider }}
      - name: Upload Terraform lockfile diagnostic
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: terraform-lock-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ matrix.root }}/.terraform.lock.hcl
          if-no-files-found: error
          retention-days: 14

  kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mark Kubernetes producer start
        uses: ./.github/actions/ci-evidence
        with:
          mode: start
          job-id: kubernetes
          job-name: kubernetes / render
          artifact-key: kubernetes
      - name: Bootstrap hash-locked Dagger runtime
        run: python3 .github/dagger/_bootstrap.py
      - name: Run Kubernetes verification
        uses: ./.github/actions/ci-evidence
        with:
          mode: run
          job-id: kubernetes
          job-name: kubernetes / render
          artifact-key: kubernetes
          step-name: Run Kubernetes policy tests
          command: .dagger-ci-venv/bin/python .github/dagger/kubernetes.py
      - name: Finalize Kubernetes evidence
        if: ${{ always() }}
        uses: ./.github/actions/ci-evidence
        with:
          mode: finish
          job-id: kubernetes
          job-name: kubernetes / render
          artifact-key: kubernetes
          status: ${{ job.status }}
          command-identity: dagger/kubernetes

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mark Python producer start
        uses: ./.github/actions/ci-evidence
        with:
          mode: start
          job-id: python
          job-name: python / simulator and observability
          artifact-key: python
      - name: Bootstrap hash-locked Dagger runtime
        run: python3 .github/dagger/_bootstrap.py
      - name: Run Python verification
        uses: ./.github/actions/ci-evidence
        with:
          mode: run
          job-id: python
          job-name: python / simulator and observability
          artifact-key: python
          step-name: Test observability
          command: .dagger-ci-venv/bin/python .github/dagger/python_checks.py
      - name: Finalize Python evidence
        if: ${{ always() }}
        uses: ./.github/actions/ci-evidence
        with:
          mode: finish
          job-id: python
          job-name: python / simulator and observability
          artifact-key: python
          status: ${{ job.status }}
          command-identity: dagger/python

  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mark architecture producer start
        uses: ./.github/actions/ci-evidence
        with:
          mode: start
          job-id: architecture
          job-name: architecture / boundaries and schema
          artifact-key: architecture
      - name: Bootstrap hash-locked Dagger runtime
        run: python3 .github/dagger/_bootstrap.py
      - name: Run architecture verification
        uses: ./.github/actions/ci-evidence
        with:
          mode: run
          job-id: architecture
          job-name: architecture / boundaries and schema
          artifact-key: architecture
          step-name: Run architecture tests
          command: .dagger-ci-venv/bin/python .github/dagger/architecture.py
      - name: Finalize architecture evidence
        if: ${{ always() }}
        uses: ./.github/actions/ci-evidence
        with:
          mode: finish
          job-id: architecture
          job-name: architecture / boundaries and schema
          artifact-key: architecture
          status: ${{ job.status }}
          command-identity: dagger/architecture

  gui-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mark GUI producer start
        uses: ./.github/actions/ci-evidence
        with:
          mode: start
          job-id: gui-contract
          job-name: gui / contract
          artifact-key: gui-contract
      - name: Bootstrap hash-locked Dagger runtime
        run: python3 .github/dagger/_bootstrap.py
      - name: Run GUI contract verification
        uses: ./.github/actions/ci-evidence
        with:
          mode: run
          job-id: gui-contract
          job-name: gui / contract
          artifact-key: gui-contract
          step-name: Run GUI contract test
          command: .dagger-ci-venv/bin/python .github/dagger/gui.py
      - name: Finalize GUI evidence
        if: ${{ always() }}
        uses: ./.github/actions/ci-evidence
        with:
          mode: finish
          job-id: gui-contract
          job-name: gui / contract
          artifact-key: gui-contract
          status: ${{ job.status }}
          command-identity: dagger/gui

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mark security producer start
        uses: ./.github/actions/ci-evidence
        with:
          mode: start
          job-id: security
          job-name: security / dependencies and source
          artifact-key: security
      - name: Bootstrap hash-locked Dagger runtime
        run: python3 .github/dagger/_bootstrap.py
      - name: Run security verification
        uses: ./.github/actions/ci-evidence
        with:
          mode: run
          job-id: security
          job-name: security / dependencies and source
          artifact-key: security
          step-name: Secret and infrastructure scan
          command: .dagger-ci-venv/bin/python .github/dagger/security.py
      - name: Finalize security evidence
        if: ${{ always() }}
        uses: ./.github/actions/ci-evidence
        with:
          mode: finish
          job-id: security
          job-name: security / dependencies and source
          artifact-key: security
          status: ${{ job.status }}
          command-identity: dagger/security

  canonical-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mark canonical regression producer start
        uses: ./.github/actions/ci-evidence
        with:
          mode: start
          job-id: canonical-regression
          job-name: regression / canonical 200
          artifact-key: canonical-regression
      - name: Bootstrap hash-locked Dagger runtime
        run: python3 .github/dagger/_bootstrap.py
      - name: Run canonical regressions
        uses: ./.github/actions/ci-evidence
        with:
          mode: run
          job-id: canonical-regression
          job-name: regression / canonical 200
          artifact-key: canonical-regression
          step-name: Run all canonical regression tests
          command: .dagger-ci-venv/bin/python .github/dagger/canonical_regression.py
      - name: Finalize canonical regression evidence
        if: ${{ always() }}
        uses: ./.github/actions/ci-evidence
        with:
          mode: finish
          job-id: canonical-regression
          job-name: regression / canonical 200
          artifact-key: canonical-regression
          status: ${{ job.status }}
          command-identity: dagger/canonical-regression
      - name: Upload canonical regression reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: canonical-regression-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/canonical-regressions
          if-no-files-found: error
          retention-days: 14

  e2e:
    needs:
      - go
      - rust-trade-settlement
      - terraform
      - kubernetes
      - python
      - architecture
      - gui-contract
      - security
      - canonical-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mark E2E producer start
        uses: ./.github/actions/ci-evidence
        with:
          mode: start
          job-id: e2e
          job-name: e2e / observed
          artifact-key: e2e
      - name: Bootstrap hash-locked Dagger runtime
        run: python3 .github/dagger/_bootstrap.py
      - name: Run observed integration tests
        uses: ./.github/actions/ci-evidence
        with:
          mode: run
          job-id: e2e
          job-name: e2e / observed
          artifact-key: e2e
          step-name: Run observed integration tests
          command: .dagger-ci-venv/bin/python .github/dagger/e2e.py scripts/run_kind_e2e.sh
      - name: Finalize E2E evidence
        if: ${{ always() }}
        uses: ./.github/actions/ci-evidence
        with:
          mode: finish
          job-id: e2e
          job-name: e2e / observed
          artifact-key: e2e
          status: ${{ job.status }}
          command-identity: dagger/e2e
          dependencies: go rust-trade-settlement terraform kubernetes python architecture gui-contract security canonical-regression
      - name: Upload redacted E2E diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .o11y/e2e.log
            .o11y/e2e-summary.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  o11y-aggregate:
    if: ${{ always() }}
    needs:
      - proto
      - go
      - rust-trade-settlement
      - terraform
      - kubernetes
      - python
      - architecture
      - gui-contract
      - security
      - canonical-regression
      - e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      verified_sha: ${{ steps.verification.outputs.verified_sha }}
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap hash-locked Dagger runtime
        run: python3 .github/dagger/_bootstrap.py
      - name: Download current-run producer evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: o11y-producer-*
          path: .o11y/producer-artifacts
          merge-multiple: true
      - id: verification
        name: Aggregate observed CI evidence
        run: .dagger-ci-venv/bin/python .github/dagger/o11y.py
        env:
          OBS_CI_NEEDS_JSON: ${{ toJson(needs) }}
      - name: Upload observability aggregate
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: o11y-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .o11y
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  release-verification:
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.reliability-contract.result == 'success' &&
          needs.e2e.result == 'success' &&
          needs.o11y-aggregate.result == 'success' &&
          needs.o11y-aggregate.outputs.verified_sha == github.sha }}
    needs: [reliability-contract, e2e, o11y-aggregate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap hash-locked Dagger runtime without registry credentials
        run: python3 .github/dagger/_bootstrap.py
      - name: Build exact verified revision without registry credentials
        run: .dagger-ci-venv/bin/python .github/dagger/release.py build
        env:
          VERIFIED_SHA: ${{ needs.o11y-aggregate.outputs.verified_sha }}
      - name: Publish prebuilt images in isolated credential boundary
        shell: bash
        env:
          VERIFIED_SHA: ${{ needs.o11y-aggregate.outputs.verified_sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$VERIFIED_SHA" = "$GITHUB_SHA"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          publisher_output="$(mktemp -d "${RUNNER_TEMP}/eve-trade-publisher.XXXXXX")"
          cleanup_host() {
            rm -rf -- "$publisher_output"
            unset GHCR_TOKEN
          }
          trap cleanup_host EXIT
          printf '%s' "$GHCR_TOKEN" | docker run --rm -i \
            --entrypoint sh \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$publisher_output:/out" \
            --env GITHUB_ACTOR \
            --env GITHUB_REPOSITORY \
            --env GITHUB_RUN_ATTEMPT \
            --env GITHUB_RUN_ID \
            --env GITHUB_SHA \
            --env "RELEASE_OWNER=$owner" \
            docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c \
            -euc '
              token="$(cat)"
              export DOCKER_CONFIG="$(mktemp -d)"
              manifest_dir="$(mktemp -d)"
              logged_in=0
              cleanup() {
                set +e
                if [ "$logged_in" = 1 ]; then docker logout ghcr.io >/dev/null 2>&1; fi
                rm -rf "$DOCKER_CONFIG" "$manifest_dir"
                unset token DOCKER_CONFIG manifest_dir
              }
              trap cleanup EXIT
              printf "%s" "$token" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
              unset token
              logged_in=1
              encore_ref="ghcr.io/${RELEASE_OWNER}/eve-trade-encore-backend:${GITHUB_SHA}"
              settlement_ref="ghcr.io/${RELEASE_OWNER}/eve-trade-trade-settlement:${GITHUB_SHA}"
              quilkin_ref="ghcr.io/${RELEASE_OWNER}/eve-trade-quilkin:${GITHUB_SHA}"
              docker image inspect "$encore_ref" >/dev/null
              docker image inspect "$settlement_ref" >/dev/null
              docker image inspect "$quilkin_ref" >/dev/null
              docker push "$encore_ref"
              docker push "$settlement_ref"
              docker push "$quilkin_ref"
              docker buildx imagetools inspect "$encore_ref" --raw > "$manifest_dir/encore"
              docker buildx imagetools inspect "$settlement_ref" --raw > "$manifest_dir/settlement"
              docker buildx imagetools inspect "$quilkin_ref" --raw > "$manifest_dir/quilkin"
              test -s "$manifest_dir/encore"
              test -s "$manifest_dir/settlement"
              test -s "$manifest_dir/quilkin"
              checksum="$(sha256sum "$manifest_dir/encore")"; encore_digest="${checksum%% *}"
              checksum="$(sha256sum "$manifest_dir/settlement")"; settlement_digest="${checksum%% *}"
              checksum="$(sha256sum "$manifest_dir/quilkin")"; quilkin_digest="${checksum%% *}"
              for digest in "$encore_digest" "$settlement_digest" "$quilkin_digest"; do
                test "${#digest}" -eq 64
                case "$digest" in *[!0-9a-f]*) exit 1;; esac
              done
              cat > /out/release-image-lock.json <<JSON
          {
            "images": {
              "encore-backend": "ghcr.io/${RELEASE_OWNER}/eve-trade-encore-backend@sha256:${encore_digest}",
              "quilkin": "ghcr.io/${RELEASE_OWNER}/eve-trade-quilkin@sha256:${quilkin_digest}",
              "trade-settlement": "ghcr.io/${RELEASE_OWNER}/eve-trade-trade-settlement@sha256:${settlement_digest}"
            },
            "repository": "${GITHUB_REPOSITORY}",
            "schema_version": "eve-trade.image-lock/v1",
            "sha": "${GITHUB_SHA}",
            "workflow_run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "workflow_run_id": "${GITHUB_RUN_ID}"
          }
          JSON
            '
          unset GHCR_TOKEN
          install -m 0600 "$publisher_output/release-image-lock.json" release-image-lock.json
          trap - EXIT
          rm -rf -- "$publisher_output"
      - id: release
        name: Verify release artifacts without registry credentials
        run: .dagger-ci-venv/bin/python .github/dagger/release.py verify
        env:
          VERIFIED_SHA: ${{ needs.o11y-aggregate.outputs.verified_sha }}
      - name: Upload release verification
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-verification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-verification.json
            release-image-lock.json
            release-kubernetes.yaml
          if-no-files-found: error
          retention-days: 30
