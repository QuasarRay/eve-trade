apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nsqd
spec:
  template:
    spec:
      containers:
        - name: nsqd
          args:
            - --data-path=/data
            - --broadcast-address=nsqd
            - --mem-queue-size=0
            - --sync-every=1
            - --sync-timeout=1s
            - --msg-timeout=60s
            - --max-msg-timeout=15m
            - --max-req-timeout=2m
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              $patch: delete
      volumes:
        - name: tls
          $patch: delete
