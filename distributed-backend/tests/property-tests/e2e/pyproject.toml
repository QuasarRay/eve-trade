[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-trade-hypothesis-contracts"
version = "0.1.0"
description = "Hypothesis implementation of the comprehensive EVE Trade E2E contract catalog"
requires-python = ">=3.12"
dependencies = [
  "pytest>=8.0,<10",
  "hypothesis>=6.100,<7",
  "PyYAML>=6.0,<7",
  "psycopg[binary]>=3.1,<4",
  "grpcio>=1.60,<2",
  "grpcio-tools>=1.60,<2",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["eve_trade_hypothesis*"]

[tool.setuptools.package-data]
eve_trade_hypothesis = ["catalog.json"]
