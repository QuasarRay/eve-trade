[pytest]
testpaths = eve_trade_hypothesis/generated tests
addopts = -ra --strict-markers
markers =
    hypothesis_contract: generated contract sourced from the comprehensive EVE Trade catalog
    eve_existing: Hypothesis wrapper around a currently existing native E2E test
    eve_live: requires the live EVE Trade E2E service/database environment
    eve_static: inspects repository/configuration/tool output
    eve_fault: requires deterministic external fault injection
