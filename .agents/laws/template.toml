[[law]]
id = "example.public_entrypoint_exists"
description = "The supported public entrypoint remains present."
kind = "file_exists"
path = "path/to/entrypoint"
severity = "hard"
tags = ["compatibility"]

[[law]]
id = "example.production_probe"
description = "Production probe succeeds without fixture-specific behavior."
kind = "command"
command = ["{python}", "path/to/probe.py"]
expected_exit = 0
timeout_seconds = 30
severity = "hard"
tags = ["behavior"]

