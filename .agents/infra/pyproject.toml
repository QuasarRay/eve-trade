[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-agentinfra"
version = "4.0.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
meta = ["mcpyrate", "unpythonic"]
test = ["hypothesis>=6.100,<7"]

[project.scripts]
agentctl = "agentinfra.cli:main"
